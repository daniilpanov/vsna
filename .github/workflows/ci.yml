name: CI

on:
  pull_request:

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.4.0
        with:
          packages: build-essential g++ cmake ninja-build pkg-config
          version: 1.0
          execute_install_scripts: false

      - name: Configure & build with vcpkg presets
        run: |
          cmake --preset default
          cmake --build --preset default --target vsna_tests -j2

      - name: Run tests
        run: ctest --test-dir out --output-on-failure
