name: Format check

on:
  pull_request:

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-clang-format-21.1.8

      # Pin the same clang-format used by `make format` locally (21.1.8) so the
      # check cannot silently pass or fail on a version mismatch.
      - name: Install clang-format
        run: pip install --quiet clang-format==21.1.8

      # Fails if any tracked source file is not formatted exactly as the repo's
      # .clang-format requires. Uses `git ls-files` so build artifacts (out/,
      # out-native/, vcpkg/) are never checked.
      - name: Check formatting
        run: |
          files="$(git ls-files -- '*.cpp' '*.h' '*.hpp' '*.cc' '*.hh')"
          if ! clang-format --dry-run --Werror $files; then
            echo "::error::Some files are not formatted. Run 'make format' and commit the changes."
            exit 1
          fi